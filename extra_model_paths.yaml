# FULL BAKE-IN config: models are baked into the image at /comfyui/models.
# Point base_path at /comfyui so ComfyUI scans the baked models.
# (Do NOT point at /runpod-volume — that is empty when no volume is mounted on a baked-in worker.)
runpod_worker_comfy:
  base_path: /comfyui
  checkpoints: models/checkpoints/
  clip: models/clip/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  diffusion_models: models/diffusion_models/
  embeddings: models/embeddings/
  loras: models/loras/
  text_encoders: models/text_encoders/
  upscale_models: models/upscale_models/
  vae: models/vae/
  unet: models/unet/
